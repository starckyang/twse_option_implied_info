[project]
name = "twvix"
version = "0.1.0"
description = "Taiwan VIX / SVIX daily report"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "pyyaml", "requests"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twvix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
twvix = "twvix.cli:main"
