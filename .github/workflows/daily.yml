name: daily

on:
  schedule:
    # 台北時間 平日 14:30 / 16:30 / 19:30（UTC 06:30 / 08:30 / 11:30）。
    # TAIFEX 實際公布時間尚未實測，多跑幾次；同一天重跑只會覆蓋該日（upsert），沒有變化就不 commit。
    - cron: "30 6,8,11 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "true＝從 backfill_start 全部掃描補漏（預設只掃最近 14 天）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: twvix-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Update latest (fill gaps incl. today) and push to data branch
        env:
          TWVIX_FULL: ${{ github.event.inputs.full == 'true' && '1' || '' }}
        run: uv run doit update_latest
