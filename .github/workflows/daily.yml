name: daily

on:
  schedule:
    # 台北時間 平日 18:00（UTC 10:00）。漏掉的日子與官方 VIX 晚公布的日子，下一次會自動補上。
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "true＝從 backfill_start 全部掃描補漏（預設只掃最近 14 天）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: twvix-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Update latest (fill gaps incl. today) and push to data branch
        env:
          TWVIX_FULL: ${{ github.event.inputs.full == 'true' && '1' || '' }}
        run: uv run doit update_latest

      - name: Build report and publish to gh-pages
        run: uv run doit report publish_pages
