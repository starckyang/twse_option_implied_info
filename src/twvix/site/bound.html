<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>預期超額報酬下界</title><link rel="stylesheet" href="assets/style.css"></head><body><main>
__NAV__
<h1>預期超額報酬下界</h1>
<div class="sub">SVIX² 可以當作市場預期超額報酬的下界（Martin, 2017）：E[R] − Rf ≥ Rf · SVIX² · T。</div>
<p class="explain">__BOUND__</p>

<div class="stats" id="stats" style="margin-top:12px"></div>

<div class="bar" role="group" aria-label="日期範圍"><span class="lab">日期範圍</span>
  <button class="chip" data-range="30" aria-pressed="false">近 30 天</button>
  <button class="chip" data-range="90" aria-pressed="false">近 90 天</button>
  <button class="chip" data-range="0" aria-pressed="true">全部</button></div>

<div class="card" style="margin-top:12px"><p class="ctitle">未來 30 天預期超額報酬下界</p><p class="cdesc">Rf · SVIX² · (30/365)；提示框同時列出年化數字</p>
  <div class="chart"><canvas id="c-bound" role="img" aria-label="未來 30 天預期超額報酬下界的時間序列"></canvas></div></div>

<h2>統計（目前日期範圍）</h2>
<div class="card"><table id="stable"><thead><tr><th></th><th>30 天下界</th><th>年化 SVIX²</th><th>SVIX</th></tr></thead><tbody></tbody></table></div>

<h2>資料表</h2>
<div class="bar" style="margin-top:0"><button class="chip" id="dl" type="button">下載 CSV（目前日期範圍）</button></div>
<div class="card"><div class="scroll" style="max-height:420px"><table id="dtable"><thead><tr><th>日期</th><th>SVIX</th><th>VIX</th><th>年化 SVIX²</th><th>30 天下界</th><th>VIX − SVIX</th></tr></thead><tbody></tbody></table></div></div>
__FOOTER__
</main>
<script src="assets/data.js"></script><script src="assets/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const HEAD = ['日期', 'SVIX(%)', 'VIX(%)', '年化SVIX²(%)', '30天下界(%)', 'VIX−SVIX'];
const cells = r => [r.date, num(r.svix), num(r.vix), pct(r.lb_ann, 2), pct(r.lb_30d, 2), num(r.vix - r.svix)];
const csvRow = r => [r.date, r.svix, r.vix, r.lb_ann == null ? '' : r.lb_ann * 100, r.lb_30d == null ? '' : r.lb_30d * 100, r.vix - r.svix];
const quant = (a, q) => { const s = a.slice().sort((x, y) => x - y), i = (s.length - 1) * q, lo = Math.floor(i); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (i - lo); };

function renderStats() {
  const v = visible(), last = S[S.length - 1];
  if (!last) return;
  const pctRank = v.length && last.lb_30d != null ? v.filter(r => r.lb_30d != null && r.lb_30d <= last.lb_30d).length / v.length : null;
  const box = $('#stats'); box.textContent = '';
  [['30 天下界（最新）', pct(last.lb_30d, 2), `${last.date}`],
   ['年化 SVIX²（最新）', pct(last.lb_ann, 1), `SVIX ${num(last.svix)}`],
   ['歷史分位', pctRank == null ? '—' : (pctRank * 100).toFixed(0) + '%', '最新值在目前範圍內的位置']].forEach(([k, val, n]) => {
    const d = document.createElement('div'); d.className = 'stat';
    [['k', k], ['v', val], ['n', n]].forEach(([c, t]) => { const e = document.createElement('div'); e.className = c; e.textContent = t; d.appendChild(e); });
    box.appendChild(d);
  });
  const tb = $('#stable tbody'); tb.textContent = '';
  const col = f => v.map(f).filter(x => x != null && isFinite(x));
  const A = col(r => r.lb_30d), B = col(r => r.lb_ann), C = col(r => r.svix);
  const ag = f => [A, B, C].map(a => a.length ? f(a) : null);  // 空資料一律顯示「—」，不顯示 Infinity / NaN
  [['最新', last.lb_30d, last.lb_ann, last.svix], ['平均', ...ag(a => a.reduce((x, y) => x + y, 0) / a.length)],
   ['中位數', ...ag(a => quant(a, .5))], ['25 分位', ...ag(a => quant(a, .25))], ['75 分位', ...ag(a => quant(a, .75))],
   ['最小', ...ag(a => Math.min(...a))], ['最大', ...ag(a => Math.max(...a))]].forEach(([lab, a, b, c]) => {
    const tr = document.createElement('tr');
    [lab, pct(a, 2), pct(b, 1), num(c)].forEach(t => { const td = document.createElement('td'); td.textContent = t; tr.appendChild(td); });
    tb.appendChild(tr);
  });
}
function render() {
  renderStats(); fillTable('#dtable', cells);
  if (typeof Chart === 'undefined') return;
  const v = visible();
  draw('c-bound', v.map(r => r.date), [line('30 天下界', v.map(r => r.lb_30d == null ? null : r.lb_30d * 100), css('--s3'), { fill: true, backgroundColor: css('--s3') + '22' })], {
    legend: false, y: { title: { display: true, text: '%', color: css('--ink-2') }, beginAtZero: true },
    tooltip: { callbacks: { label: c => ` 30 天下界  ${num(c.parsed.y, 2)}%`, afterLabel: c => ` 年化 SVIX²  ${pct(v[c.dataIndex].lb_ann, 1)}` } },
  });
}
$('#dl').addEventListener('click', () => {
  const q = x => /[",\n]/.test(String(x)) ? '"' + String(x).replace(/"/g, '""') + '"' : x;
  const csv = [HEAD, ...visible().map(csvRow)].map(r => r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'svix_premium_bound.csv'; document.body.appendChild(a); a.click(); a.remove();
});
bindRange(render);
if (typeof Chart !== 'undefined') { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render); } else { chartFallback(); }
render();
</script></body></html>
